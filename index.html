    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #c8956c;
            --primary-light: #e8c4a0;
            --secondary: #f5e6dc;
            --text: #5c4b41;
            --text-light: #8c7b71;
            --bg: #fdfbf9;
            --card-bg: #fff;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }
        .music-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            animation: rotate 6s linear infinite;
            cursor: pointer;
            border: 1px solid rgba(200,149,108,0.2);
        }
        .music-btn.paused { animation-play-state: paused; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .petal {
            position: fixed;
            top: -10%;
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffb7c5 100%);
            border-radius: 50% 0 50% 50%;
            opacity: 0.5;
            animation: fall linear infinite;
            z-index: 999;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.5; }
            25% { transform: translateY(25vh) rotate(180deg) translateX(20px); }
            50% { transform: translateY(50vh) rotate(360deg) translateX(-10px); }
            75% { transform: translateY(75vh) rotate(540deg) translateX(15px); }
            100% { transform: translateY(110vh) rotate(720deg) translateX(0); opacity: 0; }
        }
        .fade-up {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
        .fade-scale {
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .fade-scale.visible { opacity: 1; transform: scale(1); }
        .cover {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(180deg, #fdfbf9 0%, #f5e6dc 60%, #f0ddd1 100%);
            overflow: hidden;
            padding: 40px 20px;
        }
        .cover::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background: radial-gradient(circle at 20% 50%, rgba(200,149,108,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(212,165,165,0.08) 0%, transparent 50%);
            animation: drift 20s ease-in-out infinite;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(2deg); }
            66% { transform: translate(-20px, 20px) rotate(-1deg); }
        }
        .cover-frame {
            position: relative;
            z-index: 1;
            padding: 12px;
            background: rgba(255,255,255,0.6);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(92,75,65,0.15), 0 0 0 1px rgba(255,255,255,0.5) inset;
            margin-bottom: 32px;
            backdrop-filter: blur(10px);
        }
        .cover-img {
            width: 260px;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 16px;
            display: block;
        }
        .cover h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 12px;
            color: var(--primary);
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(200,149,108,0.2);
        }
        .cover .names {
            font-size: 1.15rem;
            letter-spacing: 6px;
            color: var(--text);
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            font-weight: 400;
        }
        .cover .divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            margin: 12px auto;
            position: relative;
            z-index: 1;
        }
        .cover .date {
            font-size: 0.9rem;
            color: var(--text-light);
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
        }
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            z-index: 1;
            opacity: 0.6;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-12px); }
            60% { transform: translateX(-50%) translateY(-6px); }
        }
        .invitation {
            padding: 80px 30px;
            text-align: center;
            background: var(--card-bg);
            position: relative;
        }
        .invitation-icon {
            font-size: 1.8rem;
            color: var(--primary-light);
            margin-bottom: 24px;
            opacity: 0.6;
        }
        .invitation p {
            font-size: 0.95rem;
            line-height: 2.4;
            color: var(--text-light);
            max-width: 300px;
            margin: 0 auto;
            letter-spacing: 1px;
        }
        .gallery {
            padding: 60px 16px;
            background: linear-gradient(180deg, var(--card-bg) 0%, var(--secondary) 100%);
        }
        .section-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 350;
            letter-spacing: 8px;
            color: var(--primary);
            margin-bottom: 40px;
            position: relative;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 36px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
            margin: 16px auto 0;
        }
        .photo-grid-six {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 420px;
            margin: 0 auto;
        }
        .photo-item {
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #f0f0f0;
        }
        .photo-item:active { transform: scale(0.96); }
        .photo-item:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        .photo-item:hover img { transform: scale(1.03); }
        .info {
            padding: 60px 20px;
            background: var(--card-bg);
            text-align: center;
        }
        .info-card {
            background: linear-gradient(135deg, #fdfbf9 0%, #f5e6dc 100%);
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 340px;
            margin: 0 auto;
            box-shadow: 0 12px 50px rgba(92,75,65,0.1);
            border: 1px solid rgba(200,149,108,0.1);
            position: relative;
            overflow: hidden;
        }
        .info-card::before {
            content: '❦';
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 1.5rem;
            color: var(--primary-light);
            opacity: 0.3;
        }
        .info-item { margin-bottom: 32px; position: relative; }
        .info-item:last-child { margin-bottom: 0; }
        .info-item h3 {
            font-size: 0.75rem;
            color: var(--primary);
            letter-spacing: 4px;
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
        }
        .info-item p {
            font-size: 1rem;
            color: var(--text);
            line-height: 1.9;
        }
        .info-item .highlight {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 500;
            letter-spacing: 2px;
        }
        .btn-map {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            box-shadow: 0 6px 20px rgba(200,149,108,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-map:active {
            transform: translateY(2px);
            box-shadow: 0 3px 10px rgba(200,149,108,0.3);
        }
        .countdown {
            padding: 60px 20px;
            background: linear-gradient(180deg, var(--secondary) 0%, var(--card-bg) 100%);
            text-align: center;
        }
        .timer {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 32px;
        }
        .timer-box {
            background: var(--card-bg);
            padding: 16px 10px;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.06);
            min-width: 64px;
            border: 1px solid rgba(200,149,108,0.08);
        }
        .timer-box .num {
            font-size: 1.9rem;
            color: var(--primary);
            font-weight: 300;
            display: block;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }
        .timer-box .label {
            font-size: 0.65rem;
            color: var(--text-light);
            margin-top: 6px;
            display: block;
            letter-spacing: 2px;
        }
        .timer-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--primary-light);
            padding-bottom: 20px;
        }
        .footer {
            padding: 70px 30px 50px;
            text-align: center;
            background: linear-gradient(180deg, var(--card-bg) 0%, #fdfbf9 100%);
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary-light), transparent);
        }
        .footer .quote {
            font-size: 1.05rem;
            color: var(--primary);
            letter-spacing: 4px;
            margin-bottom: 16px;
            line-height: 2;
            font-weight: 350;
        }
        .footer .sub {
            font-size: 0.8rem;
            color: #bbb;
            letter-spacing: 3px;
        }
        .footer .heart {
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
            color: #e8a0a0;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox img {
            max-width: 92%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .lightbox.active img { transform: scale(1); }
        .lightbox .close {
            position: absolute;
            top: 20px;
            right: 24px;
            color: rgba(255,255,255,0.8);
            font-size: 2.2rem;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        @media (min-width: 400px) {
            .cover-img { width: 300px; }
        }
    </style>
</head>

    <script>
        let musicPlayed = false;
        function toggleMusic() {
            const audio = document.getElementById('bgm');
            const btn = document.getElementById('musicBtn');
            if (audio.paused) {
                audio.play().catch(e => console.log('播放失败'));
                btn.classList.remove('paused');
            } else {
                audio.pause();
                btn.classList.add('paused');
            }
        }
        function autoPlay() {
            const audio = document.getElementById('bgm');
            if (!musicPlayed) {
                audio.play().then(() => { musicPlayed = true; }).catch(e => {});
            }
        }
        document.addEventListener('WeixinJSBridgeReady', autoPlay, false);
        document.addEventListener('touchstart', autoPlay, { once: true });
        document.addEventListener('click', autoPlay, { once: true });

        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = (Math.random() * 4 + 5) + 's';
            petal.style.opacity = Math.random() * 0.4 + 0.2;
            const scale = Math.random() * 0.6 + 0.4;
            petal.style.transform = `scale(${scale})`;
            document.getElementById('petals').appendChild(petal);
            setTimeout(() => petal.remove(), 10000);
        }
        setInterval(createPetal, 700);

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
        document.querySelectorAll('.fade-up, .fade-scale').forEach(el => observer.observe(el));

        function updateCountdown() {
            const weddingDate = new Date('2026-10-01T11:58:00');
            const now = new Date();
            const diff = weddingDate - now;
            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('days').textContent = String(d).padStart(2, '0');
                document.getElementById('hours').textContent = String(h).padStart(2, '0');
                document.getElementById('minutes').textContent = String(m).padStart(2, '0');
                document.getElementById('seconds').textContent = String(s).padStart(2, '0');
            } else {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }
        document.title = '刘之壮 & 程谦 | 诚挚邀请您见证幸福';
    </script>
